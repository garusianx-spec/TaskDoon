# Production-parity verification. Generate local secrets first; see docs/devops/containerization.md.
name: taskdoon-prod

x-runtime: &runtime
  init: true
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: 20m, max-file: "3"}

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: "4000"
  LOG_PRETTY: "false"
  TRUST_PROXY: "1"
  DATABASE_URL: postgres://taskin_app:${TASKIN_APP_PASSWORD:?generate local secrets}@pgbouncer:6432/taskin
  DATABASE_DIRECT_URL: postgres://taskin_app:${TASKIN_APP_PASSWORD:?generate local secrets}@postgres:5432/taskin
  DATABASE_PLATFORM_ADMIN_URL: postgres://taskin_platform_admin:${TASKIN_PLATFORM_ADMIN_PASSWORD:?generate local secrets}@postgres:5432/taskin
  DATABASE_POOL_MAX: "10"
  REDIS_CORE_URL: redis://:${REDIS_CORE_PASSWORD:?generate local secrets}@redis-core:6379
  REDIS_RT_URL: redis://:${REDIS_RT_PASSWORD:?generate local secrets}@redis-rt:6379
  S3_ENDPOINT: http://s3:8333
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://storage.localhost:8443}
  S3_BUCKET: taskin-files
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?generate local secrets}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?generate local secrets}
  PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-https://localhost:8443}
  COOKIE_SECURE: "true"
  JWT_PRIVATE_JWKS: ${JWT_PRIVATE_JWKS:?generate local secrets}
  OTP_PEPPER: ${OTP_PEPPER:?generate local secrets}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?generate local secrets}
  SMS_PROVIDERS: ${SMS_PROVIDERS:-kavenegar}
  KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:?provide SMS key or local verification placeholder}
  SMSIR_API_KEY: ${SMSIR_API_KEY:-}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}

x-api-service: &api-service
  <<: *runtime
  image: taskdoon-api:phase1
  build: {context: ., dockerfile: apps/api/Dockerfile, target: runner}
  user: node
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000"]
  cpus: 1.0
  mem_limit: 512m
  pids_limit: 128
  stop_grace_period: 30s
  networks: [database, cache, storage, application, egress]
  depends_on:
    migrate: {condition: service_completed_successfully}
    pgbouncer: {condition: service_healthy}
    redis-core: {condition: service_healthy}
    redis-rt: {condition: service_healthy}
    s3-init: {condition: service_completed_successfully}

services:
  postgres:
    <<: *runtime
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    user: postgres
    read_only: true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate local secrets}
      POSTGRES_DB: postgres
      TASKIN_APP_PASSWORD: ${TASKIN_APP_PASSWORD:?generate local secrets}
      TASKIN_MIGRATOR_PASSWORD: ${TASKIN_MIGRATOR_PASSWORD:?generate local secrets}
      TASKIN_PLATFORM_ADMIN_PASSWORD: ${TASKIN_PLATFORM_ADMIN_PASSWORD:?generate local secrets}
    command: [postgres, -c, max_connections=100, -c, shared_buffers=128MB, -c, shared_preload_libraries=pg_stat_statements]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/prod/postgres-init.sql:/docker-entrypoint-initdb.d/01-taskin.sql:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,uid=70,gid=70
    shm_size: 128m
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    networks: [database]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, taskin]
      interval: 5s
      timeout: 3s
      retries: 20

  pgbouncer:
    <<: *runtime
    image: edoburu/pgbouncer:v1.24.1-p1@sha256:3db3d7223e93af52b4116f642951a1a5fa44702a88c2a59cf7562cac19320c9e
    user: postgres
    read_only: true
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: taskin_app
      DB_PASSWORD: ${TASKIN_APP_PASSWORD:?generate local secrets}
      DB_NAME: taskin
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      LISTEN_PORT: "6432"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    tmpfs:
      - /etc/pgbouncer:rw,noexec,nosuid,size=8m,uid=70,gid=70
      - /var/run/pgbouncer:rw,noexec,nosuid,size=8m,uid=70,gid=70
      - /var/log/pgbouncer:rw,noexec,nosuid,size=8m,uid=70,gid=70
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -p 6432 -U taskin_app -d taskin]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-core:
    <<: *runtime
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    user: redis
    read_only: true
    environment:
      REDISCLI_AUTH: ${REDIS_CORE_PASSWORD:?generate local secrets}
    command: [redis-server, /run/secrets/redis-core.conf]
    secrets: [{source: redis-core-config, target: redis-core.conf}]
    volumes: [redisdata:/data]
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 64
    networks: [cache]
    healthcheck:
      test: [CMD, redis-cli, --no-auth-warning, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-rt:
    <<: *runtime
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    user: redis
    read_only: true
    environment:
      REDISCLI_AUTH: ${REDIS_RT_PASSWORD:?generate local secrets}
    command: [redis-server, /run/secrets/redis-rt.conf]
    secrets: [{source: redis-rt-config, target: redis-rt.conf}]
    cpus: 0.5
    mem_limit: 192m
    pids_limit: 64
    networks: [cache]
    healthcheck:
      test: [CMD, redis-cli, --no-auth-warning, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    <<: *runtime
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    user: seaweed
    read_only: true
    command: [server, -dir=/data, -volume.max=0, -master.volumeSizeLimitMB=256, -s3, -s3.port=8333, -s3.config=/run/secrets/s3.json, "-s3.allowedOrigins=${PUBLIC_WEB_ORIGIN:-https://localhost:8443}"]
    secrets: [{source: s3-auth, target: s3.json}]
    volumes: [s3data:/data]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000"]
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    networks: [storage]
    healthcheck:
      test: [CMD-SHELL, wget -q -O /dev/null http://127.0.0.1:8333/status]
      interval: 5s
      timeout: 3s
      retries: 40

  s3-init:
    <<: *runtime
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    user: seaweed
    read_only: true
    restart: "no"
    entrypoint: [sh, -ec]
    command:
      - |
        printf 's3.bucket.create -name taskin-files\n' | weed shell -master=s3:9333 || true
        printf 's3.bucket.list\n' | weed shell -master=s3:9333 | grep -q taskin-files
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000"]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    networks: [storage]
    depends_on:
      s3: {condition: service_healthy}

  migrate:
    <<: *runtime
    image: taskdoon-migrator:phase1
    build: {context: ., dockerfile: apps/api/Dockerfile, target: migrator}
    user: node
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000"]
    environment:
      NODE_ENV: production
      DATABASE_MIGRATOR_URL: postgres://taskin_migrator:${TASKIN_MIGRATOR_PASSWORD:?generate local secrets}@postgres:5432/taskin
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *api-service
    environment:
      <<: *api-environment
      APP_ROLE: http

  realtime:
    <<: *api-service
    environment:
      <<: *api-environment
      APP_ROLE: ws
      WS_NODE_ID: prod-parity-ws
      TRUST_PROXY: "1"

  worker:
    <<: *api-service
    environment:
      <<: *api-environment
      APP_ROLE: worker

  web:
    <<: *runtime
    image: taskdoon-web:phase1
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_DATA_SOURCE: api
        NEXT_PUBLIC_RT_URL: ""
        TASKIN_API_ORIGIN: http://api:4000
    user: node
    read_only: true
    environment: {NODE_ENV: production, PORT: "3000", HOSTNAME: 0.0.0.0}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000
    cpus: 1.0
    mem_limit: 384m
    pids_limit: 128
    stop_grace_period: 30s
    networks: [application]
    depends_on:
      api: {condition: service_healthy}
      realtime: {condition: service_healthy}

  edge:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:1.30.5-alpine@sha256:15c994d10d6d78658721c3bcafff14cb281fba2a4bdf9d5ba92c416a472516e3
    user: "101:101"
    read_only: true
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    volumes: [./infra/prod/nginx.conf:/etc/nginx/nginx.conf:ro]
    secrets: [tls-cert, tls-key]
    ports: ["127.0.0.1:${HTTPS_PORT:-8443}:8443"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,uid=101,gid=101"]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    networks: [ingress, application, storage]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/health/ready]
      interval: 10s
      timeout: 3s
      retries: 10

  mailpit:
    <<: *runtime
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    user: "1000:1000"
    read_only: true
    environment: {MP_DATABASE: /tmp/mailpit.db}
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000"]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 64
    networks: [application]
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  ingress:
  application: {internal: true}
  database: {internal: true}
  cache: {internal: true}
  storage: {internal: true}
  # Only app processes that call external SMS/SMTP providers receive outbound access.
  egress:

volumes:
  pgdata:
  redisdata:
  s3data:

secrets:
  redis-core-config: {file: ./.local/prod/redis-core.conf}
  redis-rt-config: {file: ./.local/prod/redis-rt.conf}
  s3-auth:
    file: ./.local/prod/s3.json
  tls-cert:
    file: ./.local/prod/tls/server.crt
  tls-key:
    file: ./.local/prod/tls/server.key
