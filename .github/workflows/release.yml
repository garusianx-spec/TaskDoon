name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Builds and deploys serialize so a second release cannot replace tags mid-deploy.
concurrency:
  group: taskdoon-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the release commit
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare:
    name: Validate release identity
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      owner: ${{ steps.identity.outputs.owner }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          package-manager-cache: false
      - name: Read the package version and lowercase registry owner
        id: identity
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const owner = process.env.REPOSITORY_OWNER.toLowerCase();
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error('package.json must contain a stable x.y.z release version.');
          }
          if (!/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/.test(owner)) {
            throw new Error('Invalid registry owner.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'owner=' + owner + '\nversion=' + version + '\n');
          NODE
      - name: Reject a stale main commit before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = process.env.GITHUB_API_URL + '/repos/' + process.env.GITHUB_REPOSITORY + '/git/ref/heads/main';
          const response = await fetch(endpoint, {
            headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
            signal: AbortSignal.timeout(10000),
          });
          if (!response.ok) throw new Error('Unable to verify the current main commit.');
          if ((await response.json()).object.sha !== process.env.GITHUB_SHA) {
            throw new Error('This commit is no longer current main; rerun the release for main.');
          }
          NODE

  publish:
    name: Publish ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
            target: runner
          - image: web
            dockerfile: apps/web/Dockerfile
            target: runner
          - image: migrator
            dockerfile: apps/api/Dockerfile
            target: migrator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate to GHCR with the scoped workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          images: ghcr.io/${{ needs.prepare.outputs.owner }}/taskdoon-${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=sha,format=short
            type=sha,format=long
            type=raw,value=latest
      # Build publication uses only revision tags. Promote latest/version after every image succeeds.
      - name: Select revision-only build tags
        id: revision-tags
        env:
          METADATA_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const tags = JSON.parse(process.env.METADATA_JSON).tags.filter(tag => /:sha-[a-f0-9]+$/.test(tag));
          if (tags.length !== 2 || !tags.some(tag => tag.endsWith(':sha-' + process.env.GITHUB_SHA))) {
            throw new Error('Expected short and full SHA image tags.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'tags<<TASKDOON_TAGS\n' + tags.join('\n') + '\nTASKDOON_TAGS\n');
          NODE
      - name: Build and publish the production target
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.revision-tags.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_DATA_SOURCE=api
            NEXT_PUBLIC_RT_URL=${{ vars.NEXT_PUBLIC_RT_URL || '' }}
            TASKIN_API_ORIGIN=${{ vars.TASKIN_API_ORIGIN || 'http://api:4000' }}
          cache-from: type=gha,scope=taskdoon-${{ matrix.image }},version=2
          cache-to: type=gha,scope=taskdoon-${{ matrix.image }},version=2,mode=max
          provenance: mode=max
          sbom: true
      - name: Record the delivered digest
        env:
          IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/taskdoon-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"


  promote:
    name: Promote the complete image set
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          package-manager-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require current main immediately before mutable tag promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = process.env.GITHUB_API_URL + '/repos/' + process.env.GITHUB_REPOSITORY + '/git/ref/heads/main';
          const response = await fetch(endpoint, {
            headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
            signal: AbortSignal.timeout(10000),
          });
          if (!response.ok) throw new Error('Unable to verify the current main commit.');
          if ((await response.json()).object.sha !== process.env.GITHUB_SHA) {
            throw new Error('This commit is no longer current main; rerun the release for main.');
          }
          NODE
      - name: Promote all three verified SHA indexes without rebuilding
        env:
          REGISTRY_OWNER: ${{ needs.prepare.outputs.owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for service in api web migrator; do
            image="ghcr.io/$REGISTRY_OWNER/taskdoon-$service"
            docker buildx imagetools create \
              --tag "$image:$VERSION" --tag "$image:latest" \
              "$image:sha-$GITHUB_SHA"
          done

  deploy:
    name: Trigger Coolify
    needs: [prepare, promote]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    # Checkout and the current-main guard need read access; no package writes here.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          package-manager-cache: false
      - name: Reject a stale main commit before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = process.env.GITHUB_API_URL + '/repos/' + process.env.GITHUB_REPOSITORY + '/git/ref/heads/main';
          const response = await fetch(endpoint, {
            headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
            signal: AbortSignal.timeout(10000),
          });
          if (!response.ok) throw new Error('Unable to verify the current main commit.');
          if ((await response.json()).object.sha !== process.env.GITHUB_SHA) {
            throw new Error('This commit is no longer current main; rerun the release for main.');
          }
          NODE
      - name: Request deployment through the bounded HTTPS webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: node infra/ci/trigger-coolify.mjs
