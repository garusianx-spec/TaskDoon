# Local development stack (RFC §7). `npm run infra:up` starts the backing services; add
# `--profile app` to also build and run the API (migrations first).
#
# Images are Docker Hub names. From Iran, point the Docker daemon at a registry mirror
# (`registry-mirrors` in /etc/docker/daemon.json) rather than rewriting names here.
#
# Object storage is SeaweedFS's S3 gateway (Apache-2.0): MinIO no longer publishes community
# images. The API only speaks S3 through its storage port, so production may use MinIO under a
# licence, Ceph RGW, or Arvan Object Storage unchanged.
name: taskin

x-api-env: &api-env
  NODE_ENV: development
  DATABASE_URL: postgres://taskin_app:taskin_app@pgbouncer:6432/taskin
  DATABASE_DIRECT_URL: postgres://taskin_app:taskin_app@postgres:5432/taskin
  DATABASE_MIGRATOR_URL: postgres://taskin_migrator:taskin_migrator@postgres:5432/taskin
  REDIS_CORE_URL: redis://redis-core:6379
  REDIS_RT_URL: redis://redis-rt:6379
  S3_ENDPOINT: http://s3:8333
  S3_PUBLIC_ENDPOINT: http://localhost:8333
  S3_BUCKET: taskin-files
  S3_ACCESS_KEY: taskin
  S3_SECRET_KEY: taskin-dev-secret
  SMTP_URL: smtp://mailpit:1025
  PUBLIC_WEB_ORIGIN: http://localhost:3000
  COOKIE_SECURE: "false"
  OTP_PEPPER: development-only-pepper-change-me-please
  APP_ENCRYPTION_KEY: ZGV2ZWxvcG1lbnQtb25seS1rZXktY2hhbmdlLW1lISE=
  SMS_PROVIDERS: console
  LOG_PRETTY: "false"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskin"]
      interval: 3s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: taskin_app
      DB_PASSWORD: taskin_app
      DB_NAME: taskin
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      LISTEN_PORT: "6432"
      # node-postgres sends these at connect; transaction pooling cannot keep session settings.
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["6432:6432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U taskin_app -d taskin"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-core:
    image: redis:7.4-alpine
    # Durable: BullMQ, rate limits, idempotency, revocations. BullMQ requires noeviction.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-rt:
    image: redis:7.4-alpine
    # Disposable: Socket.IO fan-out, presence, typing.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.47
    command:
      - server
      - -dir=/data
      - -volume.max=0
      - -master.volumeSizeLimitMB=256
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.allowedOrigins=http://localhost:3000
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  s3-init:
    image: chrislusf/seaweedfs:4.47
    depends_on:
      s3: { condition: service_healthy }
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo 's3.bucket.create -name taskin-files' | weed shell -master=s3:9333 || true
        echo 's3.bucket.list' | weed shell -master=s3:9333 | grep -q taskin-files
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    profiles: [app]
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment: *api-env
    command: ["node", "--enable-source-maps", "dist/cli/migrate.js"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    profiles: [app]
    build: { context: .., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *api-env
      APP_ROLE: all
      PORT: "4000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      redis-core: { condition: service_healthy }
      redis-rt: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  s3data:
