# The edge of the scaled local stack (compose.scale.yml): REST to the REST node, WebSocket
# upgrades on /rt to either WebSocket node. Clients use the WebSocket transport only, so no
# sticky sessions are needed (RFC §4).

upstream api_http {
  server api-http:4000;
}

upstream api_ws {
  server api-ws-1:4000;
  server api-ws-2:4000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_request_id $request_id_out {
  default $http_x_request_id;
  '' $request_id;
}

server {
  listen 8080;
  client_max_body_size 1m;

  location /api/ {
    proxy_pass http://api_http;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id_out;
  }

  location /rt/ {
    proxy_pass http://api_ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Above the 25 s ping interval plus the 20 s timeout, so idle sockets are not cut.
    proxy_read_timeout 75s;
  }

  location = /health/ready {
    proxy_pass http://api_http;
  }
}
