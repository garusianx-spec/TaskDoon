worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Query strings may contain presigned S3 URLs or recovery tokens.
  log_format taskdoon escape=json '{"method":"$request_method","uri":"$uri","status":$status,"duration":$request_time,"requestId":"$request_id"}';
  access_log /dev/stdout taskdoon;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  ssl_certificate /run/secrets/tls-cert;
  ssl_certificate_key /run/secrets/tls-key;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 26m;
  # Container IPs change during upgrades; re-resolve service names through Docker DNS.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;
  upstream taskdoon_api { zone api 64k; server api:4000 resolve; keepalive 16; }
  upstream taskdoon_realtime { zone realtime 64k; server realtime:4000 resolve; }
  upstream taskdoon_web { zone web 64k; server web:3000 resolve; keepalive 16; }
  upstream taskdoon_storage { zone storage 64k; server s3:8333 resolve; keepalive 16; }

  server {
    listen 8443 ssl;
    server_name localhost;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ {
      proxy_pass http://taskdoon_api;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $request_id;
    }
    location /rt/ {
      proxy_pass http://taskdoon_realtime;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 75s;
    }
    location / {
      proxy_pass http://taskdoon_web;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
  server {
    listen 8443 ssl;
    server_name storage.localhost;
    location / {
      proxy_pass http://taskdoon_storage;
      # SigV4 includes the public Host, port and path. Preserve them verbatim.
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
