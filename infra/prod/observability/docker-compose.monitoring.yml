services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: taskdoon-prometheus
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cpus: 0.5
    mem_limit: 256m
    networks:
      - internal
      - database
    ports:
      - "127.0.0.1:9090:9090"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: taskdoon-postgres-exporter
    restart: unless-stopped
    read_only: true
    environment:
      DATA_SOURCE_NAME: postgresql://taskin_platform_admin:${TASKIN_PLATFORM_ADMIN_PASSWORD}@postgres:5432/taskin?sslmode=disable
    networks:
      - database
    cpus: 0.2
    mem_limit: 64m

  redis-core-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: taskdoon-redis-core-exporter
    restart: unless-stopped
    read_only: true
    environment:
      REDIS_ADDR: redis://redis-core:6379
      REDIS_PASSWORD: ${REDIS_CORE_PASSWORD}
    networks:
      - internal
    cpus: 0.2
    mem_limit: 64m

  redis-rt-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: taskdoon-redis-rt-exporter
    restart: unless-stopped
    read_only: true
    environment:
      REDIS_ADDR: redis://redis-rt:6379
      REDIS_PASSWORD: ${REDIS_RT_PASSWORD}
    networks:
      - internal
    cpus: 0.2
    mem_limit: 64m

volumes:
  prometheus-data:

networks:
  internal:
    external: true
    name: taskdoon-prod_application
  database:
    external: true
    name: taskdoon-prod_database
